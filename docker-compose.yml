services:
  nginx:
    image: nginx:alpine
    container_name: blog_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./application/static:/app/static:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    container_name: blog_app
    expose:
      - "5000"
    environment:
      - MAIL_USERNAME=your_email@yandex.ru
      - MAIL_PASSWORD=your_app_password
      - ADMIN_MAIL=admin@gmail.com
      - SECRET_KEY=your-secret-key
      - DATABASE_URL=/app/users.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - ENV=production
      - DEBUG=False
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - ./users.db:/app/users.db
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: blog_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: